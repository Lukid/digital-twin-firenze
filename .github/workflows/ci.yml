# Lint, contratti e i test che non richiedono data/ (ignorata da git).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Ambiente della pipeline
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/pip install -r pipeline/requirements.txt
          pip install ruff==0.11.0
      - run: make ci
