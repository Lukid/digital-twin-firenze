<!doctype html><meta charset="utf-8"><title>proto A</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>html,body,#m{margin:0;height:100%}</style><div id="m"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const Z0=3.76,ring=(x,y,r,n=12)=>{const k=111320*Math.cos(y*Math.PI/180),a=[];for(let i=0;i<=n;i++){const t=2*Math.PI*i/n;a.push([x+r*Math.cos(t)/k,y+r*Math.sin(t)/111320])}return a};
Promise.all([fetch('/geometry/edifici_z2.geojson').then(r=>r.json()),fetch('/geometry/alberi_z2.geojson').then(r=>r.json())]).then(([E,A])=>{
 E.features.forEach(f=>{const p=f.properties;p.b=p.z_base-Z0;p.t=p.b+p.h});
 const C={type:'FeatureCollection',features:A.features.map(f=>{const p=f.properties,c=f.geometry.coordinates;return{type:'Feature',properties:{b:p.z_base-Z0+p.imposta,t:p.z_base-Z0+p.h},geometry:{type:'Polygon',coordinates:[ring(c[0],c[1],p.chioma_d/2)]}}})};
 window.N=E.features.length+C.features.length;
 const map=new maplibregl.Map({container:'m',center:[10.3985,43.7085],zoom:16.5,pitch:60,bearing:-25,
  style:{version:8,sources:{e:{type:'geojson',data:E},c:{type:'geojson',data:C}},layers:[{id:'bg',type:'background',paint:{'background-color':'#dde'}},
  {id:'e',type:'fill-extrusion',source:'e',paint:{'fill-extrusion-base':['get','b'],'fill-extrusion-height':['get','t'],'fill-extrusion-color':'#999'}},
  {id:'c',type:'fill-extrusion',source:'c',paint:{'fill-extrusion-base':['get','b'],'fill-extrusion-height':['get','t'],'fill-extrusion-color':'#2e7d32'}}]}});
 map.once('idle',()=>{performance.mark('first_render');window.T=performance.now();
  let n=0,t0=performance.now();const s=()=>{map.setBearing(-25+n*0.5);n++;if(performance.now()-t0<3000)requestAnimationFrame(s);else window.FPS=n/3};requestAnimationFrame(s)})});
</script>
