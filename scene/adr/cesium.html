<!doctype html><meta charset="utf-8"><title>proto B</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/'</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
<style>html,body,#m{margin:0;height:100%}</style><div id="m"></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
<script>
const Z0=3.76,ring=(x,y,r,n=12)=>{const k=111320*Math.cos(y*Math.PI/180),a=[];for(let i=0;i<n;i++){const t=2*Math.PI*i/n;a.push(x+r*Math.cos(t)/k,y+r*Math.sin(t)/111320)}return a};
const V=new Cesium.Viewer('m',{baseLayer:false,baseLayerPicker:false,geocoder:false,timeline:false,animation:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});
V.scene.globe.baseColor=Cesium.Color.fromCssColorString('#dde');
Promise.all([fetch('/geometry/edifici_z2.geojson').then(r=>r.json()),fetch('/geometry/alberi_z2.geojson').then(r=>r.json())]).then(([E,A])=>{
 const gi=[];
 E.features.forEach(f=>{const p=f.properties,g=f.geometry,rings=g.type==='Polygon'?[g.coordinates]:g.coordinates;
  rings.forEach(poly=>gi.push(new Cesium.GeometryInstance({geometry:new Cesium.PolygonGeometry({polygonHierarchy:new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(poly[0].flat())),height:p.z_base-Z0,extrudedHeight:p.z_base-Z0+p.h,vertexFormat:Cesium.PerInstanceColorAppearance.VERTEX_FORMAT}),attributes:{color:Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.fromCssColorString('#999'))}})))});
 A.features.forEach(f=>{const p=f.properties,c=f.geometry.coordinates;
  gi.push(new Cesium.GeometryInstance({geometry:new Cesium.PolygonGeometry({polygonHierarchy:new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(ring(c[0],c[1],p.chioma_d/2))),height:p.z_base-Z0+p.imposta,extrudedHeight:p.z_base-Z0+p.h,vertexFormat:Cesium.PerInstanceColorAppearance.VERTEX_FORMAT}),attributes:{color:Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.fromCssColorString('#2e7d32'))}}))});
 window.N=gi.length;
 const pr=V.scene.primitives.add(new Cesium.Primitive({geometryInstances:gi,appearance:new Cesium.PerInstanceColorAppearance({translucent:false}),asynchronous:true}));
 V.camera.lookAt(Cesium.Cartesian3.fromDegrees(10.3985,43.7085,0),new Cesium.HeadingPitchRange(Cesium.Math.toRadians(-25),Cesium.Math.toRadians(-30),900));
 const rm=V.scene.postRender.addEventListener(()=>{if(pr.ready&&!window.T){rm();V.scene.postRender.addEventListener(()=>{});
  requestAnimationFrame(()=>{window.T=performance.now();performance.mark('first_render');let n=0,t0=performance.now();const s=()=>{V.camera.lookAt(Cesium.Cartesian3.fromDegrees(10.3985,43.7085,0),new Cesium.HeadingPitchRange(Cesium.Math.toRadians(-25+n*0.5),Cesium.Math.toRadians(-30),900));n++;if(performance.now()-t0<3000)requestAnimationFrame(s);else window.FPS=n/3};requestAnimationFrame(s)})}});
});
</script>
